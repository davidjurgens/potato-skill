name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Potato's registries decide half the content here, so a change there can make
  # this repository wrong without anything being pushed to it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which Potato to check against. A push says "this pack is correct
      # against the commit it was written against"; the weekly cron asks the
      # different question "is it still correct against Potato today". Running
      # both against a moving default branch answered only the second, and made
      # every push fail whenever Potato moved first -- five of six failures in
      # sixty runs were exactly that.
      - name: Pick the Potato ref
        id: potato_ref
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Floating to Potato's default branch (weekly drift check)."
          else
            pinned="$(grep -vE '^\s*(#|$)' .github/potato-ref | head -1 | tr -d '[:space:]')"
            if [ -z "$pinned" ]; then
              echo "::error file=.github/potato-ref::no ref found in .github/potato-ref"
              exit 1
            fi
            echo "ref=$pinned" >> "$GITHUB_OUTPUT"
            echo "Pinned to Potato $pinned (see .github/potato-ref)."
          fi

      # Not `pip install potato-annotation`: the reference generator imports
      # modules that are not in any release yet, and the guards need
      # `examples/advanced/full-study-skeleton`, which is not in the wheel.
      - uses: actions/checkout@v4
        with:
          repository: davidjurgens/potato
          path: potato
          ref: ${{ steps.potato_ref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [mcp] so the MCP tool list the guards check comes off a real
          # server rather than the fallback.
          pip install -e './potato[mcp]'
          pip install -r requirements-dev.txt
          # The render guard boots a page and reads it. Without a browser it
          # skips, and a guard that always skips is not a guard.
          python -m playwright install --with-deps chromium

      - name: The generated references are current
        env:
          POTATO_REPO: ${{ github.workspace }}/potato
        run: python scripts/generate_references.py --check

      - name: Guards
        env:
          POTATO_REPO: ${{ github.workspace }}/potato
        run: pytest -v

      - name: The site builds
        run: mkdocs build --strict

      - name: The skill packages
        run: python scripts/package_skill.py --out dist
