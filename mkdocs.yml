site_name: potato-skill
site_url: https://davidjurgens.github.io/potato-skill/
site_description: >-
  potato-skill teaches Claude Code, Codex and Cursor to design, build, run and
  check human annotation studies in Potato, the self-hosted annotation tool.
site_author: Potato Development Team
repo_url: https://github.com/davidjurgens/potato-skill
repo_name: davidjurgens/potato-skill
edit_uri: ""

nav:
  - Home: index.md
  - Agent Instructions: agents-md.md
  - Designing:
      - Designing an Annotation Task: designing-a-task.md
      - What to Confirm With the Researcher: asking-the-experimenter.md
      - Interviewing the Researcher: interviewing.md
      - Writing the Annotation Guidelines: writing-guidelines.md
      - Recording Design Decisions: recording-decisions.md
      - Starting From a Published Design: finding-a-design.md
  - Building:
      - Building the Annotation Interface: building-the-ui.md
      - Evaluating and Iterating on the Interface: evaluating-the-ui.md
      - Images, Video, Audio and 3D: modalities.md
      - Agent Traces and Agent Evaluation: agent-traces.md
      - Phases and Pages: phases-and-pages.md
  - Quality:
      - Attention Checks and Gold Standards: quality-control.md
      - Assignment and Agreement: assignment-and-agreement.md
      - Modes and Subsystems: modes-and-subsystems.md
      - Model Assistance From a Self-Hosted Endpoint: model-assistance.md
  - Data:
      - Data Files and Admin Access: data-and-access.md
      - Importing Existing Annotations, Transcripts and Corpora: importing-existing-work.md
      - Getting the Annotations Out: getting-the-data-out.md
  - Running:
      - Running a Task: running-a-task.md
      - After Annotators Start: after-annotators-start.md
      - Deploying a Task: deploying.md
      - When a Task Misbehaves: troubleshooting.md
      - Reporting a Bug or Asking for a Feature: reporting-upstream.md
      - Interrogating Potato: interrogating-potato.md
  - A Worked Example: worked-example.md

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.png
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow

plugins:
  - search

# llms.txt, llms-full.txt and a .md copy of every page. See the module docstring.
hooks:
  - scripts/mkdocs_hooks.py

extra:
  # Read by overrides/main.html (structured data) and the hooks (llms.txt).
  announcement_url: https://www.potatoannotator.com/blog/potato-skill-claude-code-annotation-studies
  potato_url: https://www.potatoannotator.com/
  potato_repo_url: https://github.com/davidjurgens/potato
  keywords:
    - annotation
    - human annotation study
    - data labeling
    - Potato annotation tool
    - Claude Code skill
    - AGENTS.md
    - NLP
    - crowdsourcing
  social:
    - icon: fontawesome/solid/newspaper
      link: https://www.potatoannotator.com/blog/potato-skill-claude-code-annotation-studies
      name: Announcement on the Potato blog
    - icon: fontawesome/brands/github
      link: https://github.com/davidjurgens/potato-skill
      name: potato-skill on GitHub
    - icon: fontawesome/solid/globe
      link: https://www.potatoannotator.com/
      name: Potato

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
